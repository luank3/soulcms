services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${SKETCHCMS_DB_ROOT_PASSWORD:?set it in .env.sketchcms-demo}
      MARIADB_DATABASE: sketchcms
      MARIADB_USER: soulcms
      MARIADB_PASSWORD: ${SKETCHCMS_DB_PASSWORD:?set it in .env.sketchcms-demo}
    volumes:
      - sketchcms-demo-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  sketchcms:
    build:
      context: ./docker/compatibility-demo
      dockerfile: Dockerfile.sketchcms
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SKETCHCMS_HTTP_PORT:-8081}:80"

  soulcms:
    build:
      context: ./docker/compatibility-demo
      dockerfile: Dockerfile.soulcms
    working_dir: /workspace
    command: ["php", "bin/soulcms", "serve", "--host=0.0.0.0", "--port=8000"]
    volumes:
      - ./:/workspace
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${SOULCMS_APP_KEY:?set it in .env.sketchcms-demo}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: sketchcms
      DB_USERNAME: soulcms
      DB_PASSWORD: ${SKETCHCMS_DB_PASSWORD:?set it in .env.sketchcms-demo}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SOULCMS_HTTP_PORT:-8000}:8000"

volumes:
  sketchcms-demo-data:
